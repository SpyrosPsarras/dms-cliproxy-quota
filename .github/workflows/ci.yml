name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          additional_files: get-quota

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run tests
        run: |
          chmod +x tests/*.sh
          for t in tests/test-*.sh; do bash "$t"; done

  check-source-changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'Bump version to ')
    runs-on: ubuntu-latest
    outputs:
      has_source_changes: ${{ steps.changes.outputs.has_source_changes }}
      version_changed: ${{ steps.changes.outputs.version_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check for source file changes
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(get-quota|.*\.qml|translations\.js|plugin\.json)$'; then
            echo "has_source_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_source_changes=false" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet HEAD~1 HEAD -- plugin.json; then
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          fi

  version-bump:
    needs: [shellcheck, tests, check-source-changes]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: version-bump-maintenance
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Maintain version bump PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CREATE_BUMP: ${{ needs.shellcheck.result == 'success' && needs.tests.result == 'success' && needs.check-source-changes.outputs.has_source_changes == 'true' && needs.check-source-changes.outputs.version_changed != 'true' }}
        run: bash .github/scripts/version-bump.sh
